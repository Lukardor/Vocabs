<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lukardor Vocab (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f16;--panel:#121a24;--panel2:#1a2431;--line:#263548;--text:#e9eff7;--muted:#92a3b8;
  --a:#1ad6c4;--b:#2b9bff;--grad:linear-gradient(135deg,#1ad6c4,#2b9bff);
  --ok:#3ddc97;--bad:#ff6b7a;--on-grad:#041319;--glow:rgba(26,214,196,.45);
  --okbg:rgba(61,220,151,.12);--badbg:rgba(255,107,122,.12);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f6fb;--panel:#ffffff;--panel2:#e8f0f8;--line:#d3dfec;--text:#0f1b2a;--muted:#587088;
    --ok:#0f9b60;--bad:#d03447;--glow:rgba(43,155,255,.35);
    --okbg:rgba(15,155,96,.1);--badbg:rgba(208,52,71,.1);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f6fb;--panel:#ffffff;--panel2:#e8f0f8;--line:#d3dfec;--text:#0f1b2a;--muted:#587088;
  --ok:#0f9b60;--bad:#d03447;--glow:rgba(43,155,255,.35);
  --okbg:rgba(15,155,96,.1);--badbg:rgba(208,52,71,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-weight:800;box-shadow:0 0 18px var(--glow),0 0 2px var(--a)}
.brand-name{font-weight:700;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--on-grad)}

/* generic */
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--b)}
.btn.primary{background:var(--grad);color:var(--on-grad);border:0;box-shadow:0 8px 24px -10px var(--glow)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.inp:focus{border-color:var(--b);outline:none;box-shadow:0 0 0 3px rgba(43,155,255,.25)}
textarea.inp{min-height:140px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:0 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meter{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}

/* list cards */
.lcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer}
.lcard:hover{border-color:var(--a)}
.lcard b{font-size:18px;letter-spacing:-.01em}
.lcard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:4px 0 12px}

/* list view */
.title-inp{font:inherit;font-size:26px;font-weight:700;letter-spacing:-.02em;background:transparent;color:var(--text);border:1px solid transparent;border-radius:10px;padding:2px 8px;margin-left:-8px;width:100%}
.title-inp:hover{border-color:var(--line)}
.title-inp:focus{border-color:var(--b);outline:none}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.mode{text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:14px;padding:12px 14px;cursor:pointer}
.mode:nth-child(even){border-left-color:var(--b)}
.mode:hover:not([disabled]){border-color:var(--b)}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.words{list-style:none;margin:0;padding:0}
.w{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.wt{min-width:0}
.wt b{display:block;overflow-wrap:anywhere}
.wt span{display:block;color:var(--muted);overflow-wrap:anywhere}
.wm{display:flex;align-items:center;gap:2px;flex-shrink:0}
.lv{display:inline-flex;gap:3px;margin-right:6px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--grad)}
.ibtn{border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--panel2);color:var(--text)}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edit{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.danger-zone{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* session */
.shead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.shead .meter{flex:1}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.stage{display:grid;gap:16px;justify-items:stretch}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:240px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;cursor:pointer;text-align:center}
.flash:hover{border-color:var(--a)}
.flash-p{font-size:clamp(28px,8vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.flash-a{font-size:clamp(22px,6vw,32px);color:var(--a);font-weight:600;overflow-wrap:anywhere;padding-top:14px;border-top:1px solid var(--line);width:100%;animation:rise .25s ease-out}
.flash-hint{color:var(--muted);font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say{justify-self:center}
.prompt{font-size:clamp(26px,7vw,38px);font-weight:700;letter-spacing:-.02em;text-align:center;padding:26px 8px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;cursor:pointer;min-height:54px}
.opt:hover:not([disabled]){border-color:var(--b)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);opacity:1}
.opt.bad{border-color:var(--bad);background:var(--badbg);opacity:1}
.fb{border-radius:14px;padding:12px 14px;font-weight:500}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto 6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 30px;cursor:pointer;color:var(--text)}
.listen:hover{border-color:var(--a)}
.listen svg{width:46px;height:46px;fill:none;stroke:var(--a);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{color:var(--muted);text-align:center;margin:0 0 14px;font-size:14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px;min-height:56px;font-size:16px;cursor:pointer;overflow-wrap:anywhere}
.mt:hover:not([disabled]){border-color:var(--b)}
.mt.sel{border-color:var(--b);background:rgba(43,155,255,.14)}
.mt.done{border-color:var(--ok);background:var(--okbg);opacity:.55;cursor:default}
.mt.shake{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result{text-align:center}
.score{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.miss{list-style:none;margin:0 0 6px;padding:0;text-align:left}
.miss li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.miss li span:last-child{color:var(--muted);text-align:right}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--a);border-radius:12px;padding:10px 16px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:10;max-width:90vw}
.srow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.srow .inp{min-height:40px;padding:8px 10px}
.busy i{width:35%;animation:slide 1s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:65%}}
.right{display:flex;align-items:center;gap:10px}
.coins{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 7px;font-weight:700;font-size:14px;cursor:pointer;color:var(--text);min-height:32px;font-variant-numeric:tabular-nums}
span.coins{cursor:default}
button.coins:hover{border-color:#f5a524}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#f5a524 70%);box-shadow:inset 0 0 0 2px rgba(120,70,0,.25),0 0 8px rgba(245,165,36,.45);flex-shrink:0}
.pop{position:absolute;right:4px;top:-2px;font-weight:800;color:#f5a524;pointer-events:none;opacity:0;animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1.15)}}
.coinline{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;margin:-6px 0 14px}
.streak{font-size:13px;font-weight:600;color:var(--a);white-space:nowrap}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start}
.theme.on{border-color:var(--a)}
.sw{height:56px;border-radius:12px}
.cost{display:inline-flex;align-items:center;gap:6px}
:root[data-accent="sunset"]{--a:#ff9a5a;--b:#ff4d8d;--grad:linear-gradient(135deg,#ff9a5a,#ff4d8d);--glow:rgba(255,120,110,.45)}
:root[data-accent="violet"]{--a:#a78bfa;--b:#5b8cff;--grad:linear-gradient(135deg,#a78bfa,#5b8cff);--glow:rgba(140,130,250,.45)}
:root[data-accent="lime"]{--a:#b6f23c;--b:#22c55e;--grad:linear-gradient(135deg,#b6f23c,#22c55e);--glow:rgba(120,230,70,.4)}
:root[data-accent="gold"]{--a:#ffd45c;--b:#ff9f1c;--grad:linear-gradient(135deg,#ffd45c,#ff9f1c);--glow:rgba(255,190,60,.45)}
@media (max-width:380px){.brand-name{font-size:14px}.seg button{padding:6px 9px}}
.explain{display:grid;gap:4px}
.ex-title{font-weight:700}
.ex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:19px;margin:4px 0}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 16px}
.hi{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:32px;font-weight:600;font-size:13px;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--b)}
.chip svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.chip span{display:none}.chip{padding:4px 9px}}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.acc{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;min-width:0}
.acc b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc.on,.acc:hover{border-color:var(--a)}
.av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.parentbox{border:1px dashed var(--line);border-radius:14px;padding:12px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--a)}
.modal{position:fixed;inset:0;background:rgba(3,8,14,.68);display:grid;place-items:center;padding:20px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:360px;display:grid;gap:12px}
.sheet h2{margin:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.prow.col{flex-direction:column;align-items:stretch;gap:8px}
.prow b{display:block;font-weight:600}
.prow small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.pbody>.prow:first-child{border-top:0}
.tg{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0;margin:0;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tg:checked{background:var(--grad);border-color:transparent}
.tg:checked::after{transform:translateX(18px);background:var(--on-grad)}
input[type=range]{width:100%;accent-color:var(--a)}
.rng{display:flex;align-items:center;gap:12px}
.rng output{min-width:86px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input.tm{width:auto;min-width:120px}
details.panel>summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";color:var(--muted);font-size:22px;line-height:1}
details.panel[open]>summary::after{content:"–"}
details.panel[open]>summary{margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.days{display:flex;align-items:stretch;gap:8px;height:120px;margin-top:8px}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.dwrap{flex:1;display:flex;align-items:flex-end;width:100%}
.dfill{width:100%;background:var(--grad);border-radius:6px 6px 2px 2px;min-height:2px}
.qtimer{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:-8px 0 16px}
.qtimer i{display:block;height:100%;background:var(--grad);animation-name:qt;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes qt{from{width:100%}to{width:0}}
.pop.neg{color:var(--bad)}
.ticket{position:relative;overflow:hidden;max-width:420px;margin:6px auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px -22px var(--glow)}
.tk-top{background:var(--grad);color:var(--on-grad);padding:20px 22px 22px}
.tk-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.tk-brand .mark{width:24px;height:24px;border-radius:8px;font-size:13px;background:rgba(4,19,25,.85);color:var(--a);box-shadow:none}
.tk-kind{margin-top:14px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.tk-min{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.tk-min b{font-size:72px;line-height:1;letter-spacing:-.04em}
.tk-min span{font-size:20px;font-weight:600}
.tk-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 22px}
.tk-meta small{display:block;color:var(--muted);font-size:12px}
.tk-meta b{display:block;font-size:15px;overflow-wrap:anywhere}
.tk-perf{position:relative;height:0;margin:10px 18px 0;border-top:2px dashed var(--line)}
.tk-perf::before,.tk-perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tk-perf::before{left:-31px}
.tk-perf::after{right:-31px}
.tear{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding:20px 16px 22px;background:var(--panel2);font-weight:600;color:var(--text);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;transform-origin:0 100%;transition:transform .22s ease,opacity .22s ease}
.tear.drag{transition:none;cursor:grabbing}
.tear-arrow{display:inline-grid;color:var(--a);animation:nudge 1.4s ease-in-out infinite}
.tear-arrow svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.tk-foot{padding:18px 22px 22px;color:var(--muted);font-size:14px;text-align:center}
.ticket.void .tk-top{filter:grayscale(1);opacity:.5}
.ticket.void .tk-meta{opacity:.6}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--bad);color:var(--bad);font-weight:800;font-size:34px;letter-spacing:.06em;padding:6px 18px;border-radius:12px;text-align:center;line-height:1.2;animation:stampIn .35s cubic-bezier(.2,1.4,.4,1);background:var(--panel)}
.stamp small{display:block;font-size:12px;font-weight:600;letter-spacing:0}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.chip.cloud-on{color:var(--a)}
.chip.cloud-bad{color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 28px -8px var(--glow),0 0 0 1px rgba(255,255,255,.08);z-index:9}
.fab svg,.chatbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chatback{position:fixed;inset:0;background:rgba(3,8,14,.45);z-index:14}
.chatpanel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;height:min(78vh,640px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;z-index:15;display:flex;flex-direction:column;box-shadow:0 -18px 50px -20px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom,0px)}
.chathead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chathead b{flex:1;font-size:17px}
.chatlog{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cm{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.45;overflow-wrap:anywhere}
.cm.me{align-self:flex-end;background:var(--grad);color:var(--on-grad);border-bottom-right-radius:5px}
.cm.bot{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:5px}
.cm code{background:rgba(127,127,127,.2);border-radius:5px;padding:0 4px}
.via{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.chipq{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--text)}
.chipq:hover{border-color:var(--a)}
.chatin{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.chatin .inp{flex:1;min-width:0}
.steps{padding-left:22px;color:var(--muted);line-height:1.8;margin:0 0 14px}
textarea.sqlbox{min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre}
.qrbox{background:#fff;border-radius:14px;padding:12px;max-width:340px;margin:0 auto;width:100%}
.qrbox svg{width:100%;height:auto;display:block}
textarea.mini{min-height:74px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* Optional: fill these in to skip the in-app setup screen. */
const SUPABASE_URL="";
const SUPABASE_ANON_KEY="";
const SETUP_SQL="-- ============================================================\n-- Lukardor Vocab: cloud setup for Supabase\n-- Run this ONCE in Supabase: SQL Editor -> New query -> paste -> Run.\n-- It is safe to run again later (it only creates what is missing\n-- and replaces the functions with the newest version).\n-- ============================================================\n\n-- Password hashing (bcrypt) lives in the pgcrypto extension.\ncreate extension if not exists pgcrypto with schema extensions;\n\n-- ---------- tables (nobody can read them directly) ----------\ncreate table if not exists public.vocab_accounts (\n  id          uuid primary key default gen_random_uuid(),\n  name        text not null,\n  name_key    text not null unique,          -- lower-case login name\n  pw_hash     text not null,                 -- bcrypt hash, never leaves the server\n  pin_hash    text not null,                 -- bcrypt hash of the parent PIN\n  data        jsonb not null default '{}'::jsonb,   -- lists, coins, settings ...\n  data_ts     bigint not null default 0,     -- time of the last change (ms)\n  created_at  timestamptz not null default now(),\n  fail_pw     int not null default 0,\n  lock_pw     timestamptz,\n  fail_pin    int not null default 0,\n  lock_pin    timestamptz\n);\n\ncreate table if not exists public.vocab_sessions (\n  token_hash  text primary key,              -- sha256 of the session token\n  account_id  uuid not null references public.vocab_accounts(id) on delete cascade,\n  created_at  timestamptz not null default now(),\n  expires_at  timestamptz not null default (now() + interval '90 days')\n);\ncreate index if not exists vocab_sessions_account on public.vocab_sessions(account_id);\n\n-- Row level security ON and no policies = the public API can not touch the tables.\nalter table public.vocab_accounts enable row level security;\nalter table public.vocab_sessions enable row level security;\nrevoke all on public.vocab_accounts from anon, authenticated;\nrevoke all on public.vocab_sessions from anon, authenticated;\n\n-- ---------- internal helpers (not callable from the browser) ----------\ncreate or replace function public.vocab_session_account(p_token text)\nreturns uuid language sql security definer stable\nset search_path = public, extensions as $$\n  select account_id from public.vocab_sessions\n  where token_hash = encode(digest(coalesce(p_token, ''), 'sha256'), 'hex')\n    and expires_at > now()\n$$;\n\ncreate or replace function public.vocab_check_pin(p_id uuid, p_pin text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare a public.vocab_accounts; v_fail int;\nbegin\n  select * into a from public.vocab_accounts where id = p_id for update;\n  if not found then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  if a.lock_pin is not null and a.lock_pin > now() then\n    return jsonb_build_object('ok', false, 'error', 'locked',\n      'wait', ceil(extract(epoch from (a.lock_pin - now())))::int);\n  end if;\n  if a.pin_hash = crypt(coalesce(p_pin, ''), a.pin_hash) then\n    if a.fail_pin <> 0 or a.lock_pin is not null then\n      update public.vocab_accounts set fail_pin = 0, lock_pin = null where id = p_id;\n    end if;\n    return jsonb_build_object('ok', true);\n  end if;\n  v_fail := a.fail_pin + 1;\n  update public.vocab_accounts\n     set fail_pin = case when v_fail >= 5 then 0 else v_fail end,\n         lock_pin = case when v_fail >= 5 then now() + interval '60 seconds' else a.lock_pin end\n   where id = p_id;\n  return jsonb_build_object('ok', false, 'error', 'bad_pin');\nend $$;\n\nrevoke all on function public.vocab_session_account(text) from public, anon, authenticated;\nrevoke all on function public.vocab_check_pin(uuid, text) from public, anon, authenticated;\n\n-- ---------- public functions (the app calls these) ----------\ncreate or replace function public.vocab_ping()\nreturns jsonb language sql security definer stable set search_path = public as $$\n  select jsonb_build_object('ok', true, 'v', 1)\n$$;\n\ncreate or replace function public.vocab_signup(p_name text, p_password text, p_pin text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; v_token text; v_name text := btrim(coalesce(p_name, ''));\nbegin\n  if char_length(v_name) < 2 or char_length(v_name) > 24 then\n    return jsonb_build_object('ok', false, 'error', 'name'); end if;\n  if char_length(coalesce(p_password, '')) < 4 or char_length(p_password) > 72 then\n    return jsonb_build_object('ok', false, 'error', 'password'); end if;\n  if coalesce(p_pin, '') !~ '^[0-9]{4,6}$' then\n    return jsonb_build_object('ok', false, 'error', 'pin'); end if;\n  if p_pin = p_password then\n    return jsonb_build_object('ok', false, 'error', 'pin_same'); end if;\n  -- Protection for a public website: at most 20 new accounts per minute (change the 20 if you like).\n  if (select count(*) from public.vocab_accounts where created_at > now() - interval '1 minute') >= 20 then\n    return jsonb_build_object('ok', false, 'error', 'busy'); end if;\n  begin\n    insert into public.vocab_accounts (name, name_key, pw_hash, pin_hash)\n    values (v_name, lower(v_name), crypt(p_password, gen_salt('bf', 10)), crypt(p_pin, gen_salt('bf', 10)))\n    returning id into v_id;\n  exception when unique_violation then\n    return jsonb_build_object('ok', false, 'error', 'name_taken');\n  end;\n  v_token := encode(gen_random_bytes(32), 'hex');\n  insert into public.vocab_sessions (token_hash, account_id)\n  values (encode(digest(v_token, 'sha256'), 'hex'), v_id);\n  return jsonb_build_object('ok', true, 'token', v_token,\n    'account', jsonb_build_object('id', v_id, 'name', v_name));\nend $$;\n\ncreate or replace function public.vocab_login(p_name text, p_password text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare a public.vocab_accounts; v_token text; v_fail int;\nbegin\n  delete from public.vocab_sessions where expires_at < now();\n  select * into a from public.vocab_accounts\n   where name_key = lower(btrim(coalesce(p_name, ''))) for update;\n  if not found then\n    perform crypt(coalesce(p_password, ''), gen_salt('bf', 10));   -- same timing as a real check\n    return jsonb_build_object('ok', false, 'error', 'bad_credentials');\n  end if;\n  if a.lock_pw is not null and a.lock_pw > now() then\n    return jsonb_build_object('ok', false, 'error', 'locked',\n      'wait', ceil(extract(epoch from (a.lock_pw - now())))::int);\n  end if;\n  if a.pw_hash <> crypt(coalesce(p_password, ''), a.pw_hash) then\n    v_fail := a.fail_pw + 1;\n    update public.vocab_accounts\n       set fail_pw = case when v_fail >= 5 then 0 else v_fail end,\n           lock_pw = case when v_fail >= 5 then now() + interval '60 seconds' else a.lock_pw end\n     where id = a.id;\n    return jsonb_build_object('ok', false, 'error', 'bad_credentials');\n  end if;\n  if a.fail_pw <> 0 or a.lock_pw is not null then\n    update public.vocab_accounts set fail_pw = 0, lock_pw = null where id = a.id;\n  end if;\n  v_token := encode(gen_random_bytes(32), 'hex');\n  insert into public.vocab_sessions (token_hash, account_id)\n  values (encode(digest(v_token, 'sha256'), 'hex'), a.id);\n  return jsonb_build_object('ok', true, 'token', v_token,\n    'account', jsonb_build_object('id', a.id, 'name', a.name),\n    'data', a.data, 'data_ts', a.data_ts);\nend $$;\n\ncreate or replace function public.vocab_logout(p_token text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\nbegin\n  delete from public.vocab_sessions\n   where token_hash = encode(digest(coalesce(p_token, ''), 'sha256'), 'hex');\n  return jsonb_build_object('ok', true);\nend $$;\n\ncreate or replace function public.vocab_get(p_token text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; a public.vocab_accounts;\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  select * into a from public.vocab_accounts where id = v_id;\n  return jsonb_build_object('ok', true,\n    'account', jsonb_build_object('id', a.id, 'name', a.name),\n    'data', a.data, 'data_ts', a.data_ts);\nend $$;\n\ncreate or replace function public.vocab_put(p_token text, p_data jsonb, p_ts bigint)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; a public.vocab_accounts;\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  if p_data is null or jsonb_typeof(p_data) <> 'object' then\n    return jsonb_build_object('ok', false, 'error', 'bad_data'); end if;\n  if octet_length(p_data::text) > 1500000 then\n    return jsonb_build_object('ok', false, 'error', 'too_large'); end if;\n  select * into a from public.vocab_accounts where id = v_id for update;\n  if coalesce(p_ts, 0) >= a.data_ts then\n    update public.vocab_accounts set data = p_data, data_ts = coalesce(p_ts, 0) where id = v_id;\n    return jsonb_build_object('ok', true, 'stale', false);\n  end if;\n  return jsonb_build_object('ok', true, 'stale', true, 'data', a.data, 'data_ts', a.data_ts);\nend $$;\n\ncreate or replace function public.vocab_verify_pin(p_token text, p_pin text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid;\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  return public.vocab_check_pin(v_id, p_pin);\nend $$;\n\ncreate or replace function public.vocab_change_password(p_token text, p_pin text, p_new text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; r jsonb;\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  r := public.vocab_check_pin(v_id, p_pin);\n  if not (r->>'ok')::boolean then return r; end if;\n  if char_length(coalesce(p_new, '')) < 4 or char_length(p_new) > 72 or p_new = p_pin then\n    return jsonb_build_object('ok', false, 'error', 'password'); end if;\n  update public.vocab_accounts set pw_hash = crypt(p_new, gen_salt('bf', 10)) where id = v_id;\n  return jsonb_build_object('ok', true);\nend $$;\n\ncreate or replace function public.vocab_change_pin(p_token text, p_pin text, p_new text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; r jsonb;\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  r := public.vocab_check_pin(v_id, p_pin);\n  if not (r->>'ok')::boolean then return r; end if;\n  if coalesce(p_new, '') !~ '^[0-9]{4,6}$' then\n    return jsonb_build_object('ok', false, 'error', 'pin'); end if;\n  update public.vocab_accounts set pin_hash = crypt(p_new, gen_salt('bf', 10)) where id = v_id;\n  return jsonb_build_object('ok', true);\nend $$;\n\ncreate or replace function public.vocab_rename(p_token text, p_pin text, p_name text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; r jsonb; v_name text := btrim(coalesce(p_name, ''));\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  r := public.vocab_check_pin(v_id, p_pin);\n  if not (r->>'ok')::boolean then return r; end if;\n  if char_length(v_name) < 2 or char_length(v_name) > 24 then\n    return jsonb_build_object('ok', false, 'error', 'name'); end if;\n  begin\n    update public.vocab_accounts set name = v_name, name_key = lower(v_name) where id = v_id;\n  exception when unique_violation then\n    return jsonb_build_object('ok', false, 'error', 'name_taken');\n  end;\n  return jsonb_build_object('ok', true, 'name', v_name);\nend $$;\n\ncreate or replace function public.vocab_delete_account(p_token text, p_pin text)\nreturns jsonb language plpgsql security definer\nset search_path = public, extensions as $$\ndeclare v_id uuid; r jsonb;\nbegin\n  v_id := public.vocab_session_account(p_token);\n  if v_id is null then return jsonb_build_object('ok', false, 'error', 'auth'); end if;\n  r := public.vocab_check_pin(v_id, p_pin);\n  if not (r->>'ok')::boolean then return r; end if;\n  delete from public.vocab_accounts where id = v_id;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- Only these functions may be called from the browser.\nrevoke all on function public.vocab_ping() from public;\nrevoke all on function public.vocab_signup(text, text, text) from public;\nrevoke all on function public.vocab_login(text, text) from public;\nrevoke all on function public.vocab_logout(text) from public;\nrevoke all on function public.vocab_get(text) from public;\nrevoke all on function public.vocab_put(text, jsonb, bigint) from public;\nrevoke all on function public.vocab_verify_pin(text, text) from public;\nrevoke all on function public.vocab_change_password(text, text, text) from public;\nrevoke all on function public.vocab_change_pin(text, text, text) from public;\nrevoke all on function public.vocab_rename(text, text, text) from public;\nrevoke all on function public.vocab_delete_account(text, text) from public;\n\ngrant execute on function public.vocab_ping() to anon, authenticated;\ngrant execute on function public.vocab_signup(text, text, text) to anon, authenticated;\ngrant execute on function public.vocab_login(text, text) to anon, authenticated;\ngrant execute on function public.vocab_logout(text) to anon, authenticated;\ngrant execute on function public.vocab_get(text) to anon, authenticated;\ngrant execute on function public.vocab_put(text, jsonb, bigint) to anon, authenticated;\ngrant execute on function public.vocab_verify_pin(text, text) to anon, authenticated;\ngrant execute on function public.vocab_change_password(text, text, text) to anon, authenticated;\ngrant execute on function public.vocab_change_pin(text, text, text) to anon, authenticated;\ngrant execute on function public.vocab_rename(text, text, text) to anon, authenticated;\ngrant execute on function public.vocab_delete_account(text, text) to anon, authenticated;\n\n-- Make the API notice the new functions right away.\nnotify pgrst, 'reload schema';\n";

const enc=new TextEncoder();
function b64(buf){let x="";new Uint8Array(buf).forEach(c=>{x+=String.fromCharCode(c);});return btoa(x);}
function rnd(n){const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a);else for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*256);return b64(a);}
async function hashSecret(secret,salt){
  try{
    if(window.crypto&&crypto.subtle){
      const key=await crypto.subtle.importKey("raw",enc.encode(secret),"PBKDF2",false,["deriveBits"]);
      const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256);
      return "p:"+b64(bits);
    }
  }catch(e){}
  let h=2166136261>>>0;const str=salt+"|"+secret+"|"+salt;
  for(let r=0;r<2000;r++) for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return "f:"+h.toString(16);

async function rpc(fn,args,timeout){

  try{
    const res=await fetch(SB.url()+"/rest/v1/rpc/"+fn,{method:"POST",headers:Object.assign({"Content-Type":"application/json","apikey":SB.key()},/^eyJ/.test(SB.key())?{"Authorization":"Bearer "+SB.key()}:{}),body:JSON.stringify(args||{}),signal:ctl.signal});
    const txt=await res.text();let j=null;

/* ---------- answer checking ---------- */
function norm(s){return String(s).toLowerCase().replace(/\([^)]*\)/g," ").replace(/[.,!?;:"“”„'’]/g,"").replace(/\s+/g," ").trim();}
function deac(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function checkAns(typed,answer){
  const mode=state.P.strict;
  if(mode==="strict"){
    const clean=x=>x.replace(/\s+/g," ").trim();
    const A=answer.split(/\s*[\/;|,]\s*/).map(clean).filter(Boolean);A.push(clean(answer));
    return A.includes(clean(typed))?"ok":"bad";
  }
  const u=norm(typed); if(!u) return "bad";
  const A=answer.split(/\s*[\/;|,]\s*/).map(norm).filter(Boolean); A.push(norm(answer));
  if(A.includes(u)) return "ok";
  if(A.some(x=>deac(x)===deac(u))) return mode==="lenient"?"ok":"close";
  return "bad";
}

let VOICES=[], voiceCache={}, lastSpeak={text:"",t:0};
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){VOICES=[];}voiceCache={};}
if(TTS_HW){
  loadVoices();

}
function voiceScore(v){
  const n=(v.name||"")+" "+(v.voiceURI||"");
  let sc=0;
  if(/neural|natural|online/i.test(n)) sc+=6;
  if(/premium|enhanced|siri/i.test(n)) sc+=5;
  if(/google/i.test(n)) sc+=4;
  if(/microsoft/i.test(n)) sc+=3;
  if(v.localService) sc+=1;
  if(/compact|espeak|festival|novelty|bad news|bells|boing|cellos|good news|jester|organ|trinoids|whisper|zarvox|albert|bubbles|deranged|hysterical|junior|ralph|superstar|wobble/i.test(n)) sc-=20;
  return sc;
}
function pickVoice(lang){
  if(voiceCache[lang]!==undefined) return voiceCache[lang];
  const norm2=x=>String(x||"").replace("_","-").toLowerCase();
  const want=norm2(lang), base=want.split("-")[0];
  let best=null,bs=-99;
  VOICES.forEach(v=>{
    const vl=norm2(v.lang);
    if(vl.split("-")[0]!==base) return;
    const sc=voiceScore(v)+(vl===want?3:0);
    if(sc>bs){bs=sc;best=v;}
  });
  return voiceCache[lang]=best;
}
function speakable(x){
  const t0=String(x).replace(/\([^)]*\)/g," ").split(/\s*[\/;|]\s*/)[0].replace(/\s+/g," ").trim();
  return t0||String(x).trim();

function speak(text,lang,opts){
  if(!TTS||!lang||!text) return;
  const say=speakable(text), now=Date.now();
  const slow=!!(opts&&opts.slow)||(lastSpeak.text===say&&now-lastSpeak.t<5000);
  lastSpeak={text:say,t:now};
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      try{
        const u=new SpeechSynthesisUtterance(say);
        u.lang=lang;
        const v=pickVoice(lang);
        if(v){u.voice=v;u.lang=v.lang||lang;}
        const base=state.P.ttsRate||0.9;
        u.rate=Math.max(0.3,slow?base*0.65:base);u.pitch=1;u.volume=1;
        try{speechSynthesis.resume();}catch(_){}
        speechSynthesis.speak(u);
      }catch(e){}
    },60);
  }catch(e){}
}

async function pollChat(turns,bot,signal){
  const ctl=new AbortController(), onAbort=()=>ctl.abort();
  signal.addEventListener("abort",onAbort);
  const to=setTimeout(()=>ctl.abort(),30000);
  try{
    const res=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"openai",messages:[{role:"system",content:chatRules()},...turns],stream:true}),signal:ctl.signal});
    if(!res.ok) throw {code:"http",status:res.status};
    const ct=(res.headers&&res.headers.get&&res.headers.get("content-type"))||"";
    let full="";
    if(res.body&&res.body.getReader&&/event-stream/i.test(ct)){
      const rd=res.body.getReader(), dec=new TextDecoder();let buf="";
      for(;;){
        const {done,value}=await rd.read();if(done) break;
        buf+=dec.decode(value,{stream:true});
        let i;
        while((i=buf.indexOf("\n"))>=0){
          const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith("data:")) continue;
          const dat=line.slice(5).trim();if(dat==="[DONE]") continue;
          try{
            const j=JSON.parse(dat), dl=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
            if(dl){full+=dl;bot.text=cleanPoll(full);liveUpdate();}
          }catch(_){}
        }
      }
    }else{
      const raw=await res.text();
      try{const j=JSON.parse(raw);full=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";}catch(_){full=raw;}
    }
    full=cleanPoll(full).trim();
    if(!full) throw {code:"empty"};
    return full;
  }finally{clearTimeout(to);signal.removeEventListener("abort",onAbort);}
}
async function claudeChat(turns,bot,signal){

}
async function chatSend(text){

    CHAT.msgs.push({role:"user",text},{role:"assistant",text:t("chatLimit"),engine:"offline"});
    ui.focus="chat-in";render(true);return;
  }
  ensureDay();state.D.chat=(state.D.chat||0)+1;save();
  const bot={role:"assistant",text:"",engine:"",pending:true};
  const turns=CHAT.msgs.filter(m=>m.text&&!m.pending).slice(-8).map(m=>({role:m.role,content:m.text}));
  while(turns.length&&turns[0].role!=="user") turns.shift();
  turns.push({role:"user",content:text});
  CHAT.msgs.push({role:"user",text},bot);
  const ctl=new AbortController();CHAT.ctl=ctl;CHAT.busy=true;
  ui.focus="chat-in";render(true);
  const eng=P.chatEngine;
  const order=eng==="auto"?["pollinations","claude","offline"]:eng==="pollinations"?["pollinations","offline"]:eng==="claude"?["claude","offline"]:["offline"];
  let used="";
  for(const e of order){
    if(ctl.signal.aborted) break;
    if(e==="pollinations"&&eng==="auto"&&CHAT.pollDown&&Date.now()-CHAT.pollDown<600000) continue;
    if(e==="offline"){bot.text=offlineAnswer(text);used="offline";break;}
    try{
      bot.text="";
      const out=e==="pollinations"?await pollChat(turns,bot,ctl.signal):await claudeChat(turns,bot,ctl.signal);
      bot.text=out;used=e;break;
    }catch(err){
      if(ctl.signal.aborted) break;
      bot.text="";
      if(e==="pollinations") CHAT.pollDown=Date.now();
      if(e==="claude"&&err&&(err.code==="not_granted"||err.code==="sampling_disabled")) CHAT.claudeDenied=true;
    }
  }
  if(ctl.signal.aborted&&!used){CHAT.msgs.splice(CHAT.msgs.indexOf(bot),1);}
  else{bot.pending=false;bot.engine=used||"offline";if(!bot.text) bot.text=offlineAnswer(text);}
  CHAT.busy=false;CHAT.ctl=null;
  render();
}

function nt(c,f,t0,d,o){
  o=o||{};
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||"sine";
  osc.frequency.setValueAtTime(f,t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(o.vol||0.2,t0+(o.a||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  osc.connect(g);
  let out=g;
  if(o.lp){const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=o.lp;g.connect(lp);out=lp;}
  out.connect(MASTER);
  osc.start(t0);osc.stop(t0+d+0.05);
}
function ns(c,t0,d,o){
  o=o||{};
  const src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  src.buffer=NB;
  f.type=o.type||"bandpass";f.frequency.setValueAtTime(o.f0||1000,t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t0+d);
  f.Q.value=o.q||1;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(o.vol||0.1,t0+Math.min(0.01,d/3));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  src.connect(f);f.connect(g);g.connect(MASTER);
  src.start(t0,Math.random()*0.5);src.stop(t0+d+0.02);

  const openMin=state.vouchers.filter(v=>!v.used).reduce((n,v)=>n+v.min,0);
  const acc=state.stats.answers?Math.round(state.stats.right/state.stats.answers*100):0;

function b64u(x){return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function unb64u(x){x=String(x).replace(/-/g,"+").replace(/_/g,"/");while(x.length%4) x+="=";return atob(x);}
function makeCode(){return "LVS1."+b64u(JSON.stringify({u:SB.url(),k:SB.key()}));}
function parseCode(input){
  let x=String(input||"").trim();
  const m=/[#&?]setup=([^&\s]+)/.exec(x);
  if(m){try{x=decodeURIComponent(m[1]);}catch(e){x=m[1];}}
  if(x.indexOf("LVS1.")!==0) return null;
  try{
    const j=JSON.parse(unb64u(x.slice(5)));
    const u=String(j.u||"").trim().replace(/\/+$/,""), k=String(j.k||"").trim();
    if(!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1))[^\s]+$/i.test(u)||k.length<20) return null;
    return {url:u,key:k};
  }catch(e){return null;}
}

function bakeFile(){
  try{
    const urlq=JSON.stringify(SB.url()), keyq=JSON.stringify(SB.key());
    const scripts=[...document.scripts].filter(sc=>!sc.src).map(sc=>{
      let c=sc.textContent;
      if(c.indexOf("const SUPABASE_URL=")>=0){
        c=c.replace(/const SUPABASE_URL="[^"]*";/,()=>"const SUPABASE_URL="+urlq+";").replace(/const SUPABASE_ANON_KEY="[^"]*";/,()=>"const SUPABASE_ANON_KEY="+keyq+";");
      }
      return "<script>"+c.replace(/<\/script/gi,"<\\/script")+"<\/script>";
    });
    const h=document.head.cloneNode(true);
    h.querySelectorAll("script").forEach(n=>n.remove());
    const out="<!DOCTYPE html>\n<html lang=\"en\">\n"+h.outerHTML+"\n<body>\n<div class=\"wrap\" id=\"app\"></div>\n"+scripts.join("\n")+"\n</body>\n</html>\n";
    const blob=new Blob([out],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="index.html";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}},4000);
    showToast(t("bakeDone"));
  }catch(e){showToast(t("bakeFail"));}
}

/* ---------- session logic ---------- */
function qa(it){
  const L=list(), w=word(it.id);
  if(S&&S.mode==="listen") return {p:"",a:w.t,pl:L.from,al:L.from,w};
  return it.dir==="ta"?{p:w.t,a:w.a,pl:L.from,al:L.to,w}:{p:w.a,a:w.t,pl:L.to,al:L.from,w};
}
function pickWords(L){
  const sorted=shuffle(L.words).sort((a,b)=>(a.box||0)-(b.box||0));
  const sz=effSize();return sz==="all"?sorted:sorted.slice(0,parseInt(sz,10));
}
function chunk(items,n){
  const out=[];for(let i=0;i<items.length;i+=n) out.push(items.slice(i,i+n));
  if(out.length>1&&out[out.length-1].length===1){const last=out.pop();out[out.length-1].push(last[0]);}
  return out;
}
function startSession(mode,words){
  const L=list();
  if(!L||!state.P.modes[mode]) return;
  if(practiceBlock()){render(true);return;}
  const pool=words||pickWords(L);
  let dir=mode==="listen"?"ta":effDir();
  if(mode==="match"&&dir==="mixed") dir="ta";
  const items=pool.map(w=>({id:w.id,dir:dir==="mixed"?(Math.random()<.5?"ta":"at"):dir}));
  S={mode,items,base:items.length,requeued:new Set(),qstart:Date.now(),timedOut:false,timeUp:false,stopped:false,i:0,streak:0,earned:0,correct:0,wrong:[],phase:"q",flipped:false,opts:null,pick:null,qid:0,typed:"",res:null};
  if(mode==="match"){S.chunks=chunk(items,5);S.round=0;startMatchRound();}
  view={name:"session",id:L.id};
  sfx("start");
  window.scrollTo(0,0);

    else{
      w.box=Math.min(MAXB,(w.box||0)+1);S.correct++;S.streak++;

      let g=S.mode==="typing"?2:1;

function parseBulk(text){
  const pairs=[];let skipped=0;
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line) return;
    let parts=null;
    for(const sep of ["\t",";","="," - "," – "," — ",","]){
      const i=line.indexOf(sep);
      if(i>-1){parts=[line.slice(0,i),line.slice(i+sep.length)];break;}
    }
    if(!parts){skipped++;return;}
    const tv=parts[0].trim(),av=parts[1].trim();
    if(tv&&av) pairs.push([tv,av]); else skipped++;
  });
  return {pairs,skipped};
}

async function prepImage(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"});}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  const k=Math.min(2,2000/Math.max(w0,h0));
  const c=document.createElement("canvas");c.width=Math.round(w0*k);c.height=Math.round(h0*k);
  const x=c.getContext("2d");x.drawImage(bmp,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
    g=(g-128)*1.35+138;g=g<0?0:g>255?255:g;
    p[i]=p[i+1]=p[i+2]=g;
  }
  x.putImageData(d,0,0);
  return c;
}
function cleanCell(str){return str.replace(/^\s*\d+\s*[.)]\s+/,"").replace(/^[\s|:;=\-–—]+|[\s|:;=\-–—]+$/g,"").replace(/\s+/g," ").trim();}
function pairsFromOCR(data){
  const out=[];
  const words=(data.words||[]).filter(w=>w.text&&w.text.trim()&&w.bbox&&w.confidence>30);
  if(words.length){
    const hs=words.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b);
    const mh=Math.max(8,hs[Math.floor(hs.length/2)]);
    const cy=w=>(w.bbox.y0+w.bbox.y1)/2;
    const rows=[];
    words.slice().sort((a,b)=>cy(a)-cy(b)).forEach(w=>{
      const r=rows[rows.length-1];
      if(r&&Math.abs(cy(w)-r.cy)<mh*0.6){r.w.push(w);r.cy=r.w.reduce((n,x)=>n+cy(x),0)/r.w.length;}
      else rows.push({cy:cy(w),w:[w]});
    });
    rows.forEach(r=>{
      const ws=r.w.sort((a,b)=>a.bbox.x0-b.bbox.x0);
      if(ws.length<2) return;
      let best=-1,gap=0;
      for(let k=1;k<ws.length;k++){const g=ws[k].bbox.x0-ws[k-1].bbox.x1;if(g>gap){gap=g;best=k;}}
      let tv="",av="";
      if(best>0&&gap>mh*1.4){
        tv=cleanCell(ws.slice(0,best).map(w=>w.text).join(" "));
        av=cleanCell(ws.slice(best).map(w=>w.text).join(" "));
      }else{
        const q=parseBulk(ws.map(w=>w.text).join(" ")).pairs[0];
        if(q){tv=cleanCell(q[0]);av=cleanCell(q[1]);}
      }
      if(tv&&av) out.push({t:tv,a:av});
    });
  }
  if(!out.length&&data.text) parseBulk(data.text).pairs.forEach(([a,b])=>{const tv=cleanCell(a),av=cleanCell(b);if(tv&&av) out.push({t:tv,a:av});});
  return out;
}

  const ctl={stopped:false,abort(){ctl.stopped=true;try{if(worker) worker.terminate();}catch(e){}}};
  scanCtl=ctl;const token=ctl;
  ui.scan={status:"busy",pairs:[],token,msg:t("ocrLoading")};
  render(true);
  let last=-1,step="script";
  const setMsg=m=>{if(ui.scan&&ui.scan.token===token){ui.scan.msg=m;render(true);}};
  try{
    await loadTess();
    step="image";
    const img=await prepImage(file);
    if(ctl.stopped) throw {stopped:true};
    step="engine";
    worker=await Tesseract.createWorker(ocrLangs(L),1,{
      langPath:"https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0_best_int",
      logger:m=>{
        if(m&&m.status==="recognizing text"){
          const n=Math.round(m.progress*100);
          if(n!==last&&n%5===0){last=n;setMsg(t("ocrReading",{n}));}
        }
      }
    });
    if(ctl.stopped) throw {stopped:true};
    step="read";
    const res=await worker.recognize(img);
    const pairs=pairsFromOCR(res.data||{});
    try{await worker.terminate();}catch(e){}
    worker=null;
    if(!ui.scan||ui.scan.token!==token) return;
    ui.scan=pairs.length?{status:"review",pairs,token}:{status:"error",err:"scanEmpty",pairs:[],token};
  }catch(e){
    try{if(worker) worker.terminate();}catch(_){}
    if(!ui.scan||ui.scan.token!==token) return;
    ui.scan=(ctl.stopped||(e&&e.stopped))?null:{status:"error",err:"ocrFail",pairs:[],token,detail:step+(e&&e.message?": "+String(e.message).slice(0,80):"")};
  }finally{if(scanCtl===ctl) scanCtl=null;}
  render(true);
}
async function runScan(file){
  if(!file||!state.P.canScan||!state.P.canAddWords) return;
  if(SCAN!=="ok") return runOCR(file);
  if(!SAMPLE) return;
  const L=list(); if(!L) return;
  const ctl=new AbortController(); scanCtl=ctl;
  const token=ctl;
  ui.scan={status:"busy",pairs:[],token};
  render(true);
  const langs=(L.from||L.to)?` The list is for learning ${langName(L.from)||"a foreign language"} with translations into ${langName(L.to)||"another language"}.`:"";
  const prompt="The attached photo shows a vocabulary list (printed or handwritten)."+langs+
   " Extract every vocabulary pair. Reply with only a JSON array of objects like [{\"t\":\"la casa\",\"a\":\"das Haus\"}], "+
   "where t is the entry in the left column (the word to learn) and a is the entry in the right column (its translation). "+
   "If a row has more than two columns, use the first two. Ignore headings, page numbers, numbering, example sentences and decoration. "+
   "Keep the original spelling, articles and accents. If one entry has several translations, join them with a slash. "+
   "Skip entries you cannot read. If there is no vocabulary list, reply with [].";
  try{
    const data=await SAMPLE.json(prompt,{images:file,signal:ctl.signal,cache:false});
    if(!ui.scan||ui.scan.token!==token) return;
    const arr=Array.isArray(data)?data:(data&&Array.isArray(data.pairs)?data.pairs:[]);
    const pairs=arr.map(x=>({t:String(x&&x.t||"").trim(),a:String(x&&x.a||"").trim()})).filter(p=>p.t&&p.a);
    ui.scan=pairs.length?{status:"review",pairs,token}:{status:"error",err:"scanEmpty",pairs:[],token};
  }catch(e){
    if(!ui.scan||ui.scan.token!==token) return;
    const c=e&&e.code;
    if(c==="cancelled") ui.scan=null;
    else{
      const map={not_granted:"scanDenied",sampling_disabled:"scanDenied",rate_limited:"scanLimit",image_rejected:"scanBadImg",invalid_json:"scanEmpty"};
      ui.scan={status:"error",err:map[c]||"scanErr",pairs:[],token};
    }
  }finally{ if(scanCtl===ctl) scanCtl=null; }
  render(true);
}

  try{r=await rpc("vocab_verify_pin",{p_token:getToken(CUR),p_pin:v});}catch(e){offline=true;}
  let ok=false;

    ok=(await hashSecret(v,c.salt))===c.hash;

    case "shop": if(!state.P.shopOn) break; ui.prev=view;go({name:"shop"});break;
    case "shop-back": go(ui.prev&&ui.prev.name!=="session"&&ui.prev.name!=="shop"?ui.prev:{name:"home"});break;
    case "use": if(!state.P.themeLock&&(state.owned||[]).includes(id)){state.theme=id;save();render(true);}break;
    case "buy": if(state.P.shopPin) askPin(()=>doBuy(id)); else doBuy(id); break;
    case "quit": S=null;try{speechSynthesis.cancel();}catch(_){ }go({name:"list",id:view.id});break;
    case "again": startSession(S.mode);break;
    case "again-miss":{const ws=S.wrong.map(x=>word(x)).filter(Boolean);startSession(S.mode,ws);break;}
    case "flip": if(!S.flipped){S.flipped=true;sfx("flip");render();if(state.P.autoSpeak){const qf=qa(S.items[S.i]);speak(qf.a,qf.al);}}break;
    case "sayq":{const q=qa(S.items[S.i]);if(S.flipped) speak(q.a,q.al); else speak(q.p,q.pl);break;}
    case "flash-yes": record(qa(S.items[S.i]).w,true);advance();break;
    case "flash-no": record(qa(S.items[S.i]).w,false);advance();break;
    case "pick":{
      if(S.phase!=="q") break;
      const q=qa(S.items[S.i]),idx=parseInt(id,10);
      const ok=norm(S.opts[idx])===norm(q.a);
      S.pick=idx;S.res=ok?"ok":"bad";S.phase="fb";
      record(q.w,ok);render();
      if(ok){const k=S.qid;setTimeout(()=>{if(S&&S.qid===k&&S.phase==="fb") advance();},S.mode==="listen"?1300:700);}
      break;}
    case "check": checkTyped();break;
    case "giveup":{
      if(!S||S.phase!=="q") break;
      const q=qa(S.items[S.i]);S.typed="";S.res="bad";record(q.w,false);S.phase="fb";render();break;}
    case "sayw":{const q=qa(S.items[S.i]);speak(q.w.t,list().from);break;}
    case "cont": advance();break;
    case "replay":{const q=qa(S.items[S.i]);speak(q.a,q.pl);break;}
    case "mpick": matchPick(b.dataset.side,id);break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.p){handleP(e.target,"change");return;}
  if(e.target.id==="share-host"){AC.host=e.target.value.trim();saveAcc();render();return;}
  if(e.target.id==="scan-file"){runScan(e.target.files&&e.target.files[0]);return;}
  const c=e.target.dataset&&e.target.dataset.c; if(!c) return;
  const L=list(),v=e.target.value;
  if(c==="rename"){if(!state.P.canEditWords) return;if(L&&v.trim()){L.name=v.trim();save();}else if(L){e.target.value=L.name;}}
  else if(c==="from"){if(!state.P.canEditWords) return;L.from=v;save();render();}
  else if(c==="to"){if(!state.P.canEditWords) return;L.to=v;save();render();}
  else if(c==="dir"){state.dir=v;save();}
  else if(c==="size"){state.size=v;save();}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.tagName==="DETAILS"&&d.dataset.g) ui.open[d.dataset.g]=d.open;},true);
let tearDrag=null;
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest&&e.target.closest("[data-tear]");
  if(!el||tearDrag) return;
  tearDrag={el,x0:e.clientX,id:e.pointerId,w:Math.max(1,el.parentElement.getBoundingClientRect().width),dx:0};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.classList.add("drag");
});
document.addEventListener("pointermove",e=>{
  if(!tearDrag||e.pointerId!==tearDrag.id) return;
  const dx=Math.max(0,e.clientX-tearDrag.x0);tearDrag.dx=dx;
  tearDrag.el.style.transform="translateX("+dx+"px) rotate("+Math.min(dx/tearDrag.w*14,14)+"deg)";
  tearDrag.el.style.opacity=String(1-Math.min(dx/tearDrag.w,0.9)*0.5);
});
function endTear(e){
  if(!tearDrag||(e&&e.pointerId!==tearDrag.id)) return;
  const {el,dx,w}=tearDrag;tearDrag=null;el.classList.remove("drag");
  if(dx>w*0.5) tearOff(el); else {el.style.transform="";el.style.opacity="";}
}
document.addEventListener("pointerup",endTear);
document.addEventListener("pointercancel",endTear);
document.addEventListener("keydown",e=>{
  const el=e.target;
  if(e.key==="Escape"&&ui.chatOpen&&!ui.pin){ui.chatOpen=false;render(true);return;}
  if(el.hasAttribute&&el.hasAttribute("data-tear")&&(e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){e.preventDefault();tearOff(el);return;}
  if(e.key==="Enter"&&!e.isComposing){
    if(el.id==="a-pin2"){createAccount();return;}
    if(el.id==="l-pw"){login();return;}
    if(el.id==="pin-in"){submitPin();return;}
    if(el.id==="v-min"){buyVoucher(parseFloat(el.value));return;}
    if(el.id==="chat-in"){chatSend(el.value);return;}
    if(el.id==="nl-name") createList();
    else if(el.id==="w-term") $("w-trans").focus();
    else if(el.id==="w-trans") addWord();
    else if(el.id==="e-term") $("e-trans").focus();
    else if(el.id==="e-trans"){const b=document.querySelector('[data-a="save-edit"]');if(b) b.click();}
    else if(el.id==="ans") checkTyped();
    else if(el.dataset&&el.dataset.c==="rename") el.blur();
  }
  if(view.name==="session"&&S&&S.mode==="flash"&&S.flipped&&el.tagName!=="INPUT"){
    if(e.key==="ArrowRight"){record(qa(S.items[S.i]).w,true);advance();}
    if(e.key==="ArrowLeft"){record(qa(S.items[S.i]).w,false);advance();}
  }
});

render(true);
(async()=>{
  try{
    if(window.claude&&window.claude.use){
      SAMPLE=await window.claude.use("sample");
      if(SAMPLE){const c=await SAMPLE.limits().catch(()=>null);IMG=c&&c.images?c.images:null;SCAN=IMG?"ok":"noimg";}
      else SCAN="nosample";
    }else SCAN="nosample";
  }catch(e){SCAN="nosample";}
  render();
})();
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){flushCloud();return;}
  if(SB.ok()&&CUR&&Date.now()-CLOUD.last>60000&&!(S&&view.name==="session")) cloudRefresh();
});
window.addEventListener("pagehide",()=>{flushCloud();});
(function(){
  try{
    const m=/[#&]setup=([^&]+)/.exec(location.hash||"");
    if(!m) return;
    const c=parseCode(decodeURIComponent(m[1]));
    try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    if(c&&!SB.baked()&&!(SB.ok()&&SB.url()===c.url&&SB.key()===c.key)) ui.pendingCfg=c;
  }catch(e){}
})();
initCloud();
setInterval(()=>{
  if(!CUR||view.name!=="session"||!S||S.phase==="done"||document.visibilityState!=="visible") return;
  ensureDay();state.D.seconds++;
  if(state.D.seconds%15===0) save();
  if(!S.timeUp&&practiceBlock()) S.timeUp=true;
},1000);
</script>
